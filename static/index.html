<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuronet — своя модель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --line: #1e2733;
    --ink: #dbe4ef;
    --ink-dim: #6b7889;
    --signal: #4fd1c5;
    --signal-dim: #2a5f5a;
    --warn: #e8a15a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 300px 1fr;
  }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { border-right: none !important; border-bottom: 1px solid var(--line); }
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--signal);
  }
  .mark span { color: var(--ink-dim); }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    line-height: 1.3;
  }
  .stat-block { display: flex; flex-direction: column; gap: 4px; }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: lowercase;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--ink);
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--signal); box-shadow: 0 0 8px var(--signal); }
  .dot.off { background: var(--ink-dim); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    color: var(--signal);
    border: 1px solid var(--signal-dim);
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button:hover { border-color: var(--signal); background: rgba(79,209,197,0.06); }
  button:disabled { opacity: 0.4; cursor: default; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 8px;
  }
  main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 28px 32px;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }
  .log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-bottom: 20px;
  }
  .msg { max-width: 85%; line-height: 1.55; font-size: 15px; }
  .msg.user { align-self: flex-end; color: var(--ink); }
  .msg.user .bubble { background: var(--signal-dim); border-radius: 10px 10px 2px 10px; padding: 10px 14px; }
  .msg.model { align-self: flex-start; color: var(--ink); }
  .msg.model .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 10px 10px 10px 2px; padding: 10px 14px; }
  .msg.system { align-self: center; color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .composer {
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  textarea {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    resize: none;
    height: 48px;
  }
  textarea:focus { outline: none; border-color: var(--signal-dim); }
  .send {
    background: var(--signal-dim);
    color: var(--bg);
    border: none;
    font-weight: 600;
  }
  .send:hover { background: var(--signal); }
</style>
</head>
<body>

<aside>
  <div>
    <div class="mark">neuronet <span>// self-taught</span></div>
    <h1>Своя модель, растущая на собранных данных</h1>
  </div>

  <div class="stat-block">
    <div class="stat-label">статус модели</div>
    <div class="stat-value"><span class="dot off" id="model-dot"></span><span id="model-status">проверка...</span></div>
  </div>

  <div class="stat-block">
    <div class="stat-label">документов в корпусе</div>
    <div class="stat-value" id="doc-count">—</div>
  </div>

  <div class="stat-block">
    <div class="stat-label">циклов обучения</div>
    <div class="stat-value" id="cycle-count">—</div>
  </div>

  <div class="stat-block">
    <div class="stat-label">автоскан каждые</div>
    <div class="stat-value" id="scan-interval">—</div>
  </div>

  <div class="stat-block">
    <div class="stat-label">темы поиска</div>
    <div class="topics" id="topics"></div>
  </div>

  <div class="stat-block" id="error-block" style="display:none;">
    <div class="stat-label" style="color:#e8a15a;">последняя ошибка</div>
    <div class="stat-value" id="last-error" style="color:#e8a15a; font-size:12px; word-break:break-word;"></div>
  </div>

  <button id="scan-btn">запустить скан сейчас</button>
</aside>

<main>
  <div class="log" id="log">
    <div class="msg system">модель отвечает тем, чему научилась на собранных данных</div>
  </div>
  <div class="composer">
    <textarea id="input" placeholder="напиши что-нибудь..."></textarea>
    <button class="send" id="send-btn">→</button>
  </div>
</main>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const scanBtn = document.getElementById('scan-btn');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (cls === 'system') {
    div.textContent = text;
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function refreshStatus() {
  try {
    const r = await fetch('/status');
    const s = await r.json();
    const dot = document.getElementById('model-dot');
    const statusEl = document.getElementById('model-status');
    if (s.pipeline_running) {
      dot.className = 'dot busy';
      statusEl.textContent = 'идёт скан / обучение';
    } else if (s.model_ready) {
      dot.className = 'dot on';
      statusEl.textContent = 'обучена, отвечает';
    } else {
      dot.className = 'dot off';
      statusEl.textContent = 'ещё не обучена';
    }
    document.getElementById('doc-count').textContent = s.state.total_docs ?? 0;
    document.getElementById('cycle-count').textContent = s.state.cycles ?? 0;
    document.getElementById('scan-interval').textContent = s.scan_interval_minutes + ' мин';
    const topicsEl = document.getElementById('topics');
    topicsEl.innerHTML = '';
    (s.topics || []).forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'topic-chip';
      chip.textContent = t;
      topicsEl.appendChild(chip);
    });
    const errBlock = document.getElementById('error-block');
    const errEl = document.getElementById('last-error');
    const lastError = s.state.last_error;
    if (lastError) {
      errBlock.style.display = 'flex';
      errEl.textContent = lastError;
    } else {
      errBlock.style.display = 'none';
    }
  } catch (e) { /* тихо игнорируем сетевые сбои опроса */ }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const thinking = addMsg('генерирует...', 'system');
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text })
    });
    const data = await r.json();
    thinking.remove();
    if (data.error) {
      addMsg(data.error, 'system');
    } else {
      addMsg(data.text, 'model');
    }
  } catch (e) {
    thinking.remove();
    addMsg('ошибка сети', 'system');
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
scanBtn.addEventListener('click', async () => {
  scanBtn.disabled = true;
  scanBtn.textContent = 'запущено...';
  await fetch('/scan', { method: 'POST' });
  setTimeout(() => { scanBtn.disabled = false; scanBtn.textContent = 'запустить скан сейчас'; }, 3000);
});

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
